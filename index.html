<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>手绘白板 · Whiteboard（手绘风，离线可用）</title>
<meta name="description" content="浏览器里的手绘风白板：矩形/圆/菱形/箭头/自由笔/文字，支持多选、缩放平移、填充样式与粗糙度，导出 PNG / SVG / JSON。全部本地处理。" />
<meta property="og:title" content="手绘白板 · Whiteboard" />
<meta property="og:description" content="手绘风图形 + 压感笔迹，多选缩放，导出 PNG/SVG/JSON。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f08c00' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 20l3.5-.8L20 6.7a2 2 0 0 0-2.8-2.8L4.7 16.5z'/%3E%3Cpath d='M15.5 5.5l3 3'/%3E%3C/svg%3E" />
<style>
[hidden] { display: none !important; }

:root {
  --bg: #f8f9fb; --surface: #fff; --surface2: #f2f4f9; --surface3: #e8ecf5;
  --text: #1e1e1e; --muted: #6b7385; --border: #e0e5ef;
  --primary: #f08c00; --accent: #7048e8; --danger: #e03131;
  --shadow: 0 6px 22px rgba(23, 32, 64, .1);
  --mono: ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161c; --surface: #1b1e26; --surface2: #232733; --surface3: #2c3140;
    --text: #e8ecf4; --muted: #8b93a7; --border: #2c3140;
    --shadow: 0 8px 26px rgba(0, 0, 0, .5);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text); overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 13.5px; -webkit-font-smoothing: antialiased;
}
.app { display: flex; flex-direction: column; height: 100vh; }

/* ---------- 浮动工具条 ---------- */
.toolbar {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 30;
  display: flex; align-items: center; gap: 6px; padding: 7px 9px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: var(--shadow); flex-wrap: wrap; max-width: calc(100vw - 28px);
}
.tool {
  width: 36px; height: 34px; display: grid; place-items: center; border-radius: 9px;
  border: 1px solid transparent; background: transparent; color: var(--text); cursor: pointer;
}
.tool:hover { background: var(--surface2); }
.tool.on { background: color-mix(in srgb, var(--primary) 18%, transparent); color: var(--primary); border-color: color-mix(in srgb, var(--primary) 35%, transparent); }
.tool svg { width: 18px; height: 18px; }
.sep { width: 1px; height: 22px; background: var(--border); margin: 0 3px; }
.mini {
  border: 1px solid var(--border); background: var(--surface2); color: var(--text);
  border-radius: 8px; padding: 5px 9px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit;
}
.mini:hover { background: var(--surface3); }
.mini:disabled { opacity: .4; cursor: default; }

.sw { width: 22px; height: 22px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
.sw.on { border-color: var(--text); }
.sw.none { background: repeating-linear-gradient(45deg, #fff 0 3px, #ccc 3px 6px); }

/* ---------- 浮动属性条（左侧） ---------- */
.props {
  position: absolute; top: 14px; left: 14px; z-index: 29; width: 190px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: var(--shadow); padding: 11px 12px; font-size: 12px;
}
.props .grp { margin-bottom: 10px; }
.props .grp:last-child { margin-bottom: 0; }
.props .lbl { color: var(--muted); font-size: 11.5px; margin-bottom: 5px; }
.props .sws { display: flex; gap: 5px; flex-wrap: wrap; }
.props select, .props input[type="range"] { width: 100%; }
.props select {
  background: var(--surface2); color: var(--text); border: 1px solid var(--border);
  border-radius: 7px; padding: 4px 7px; font-size: 12px; font-family: inherit; outline: none;
}
.props input[type="range"] { accent-color: var(--primary); }
.props .val { color: var(--muted); font-size: 11px; }

/* ---------- 画布 ---------- */
.stage { flex: 1; position: relative; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; }
.editor {
  position: absolute; z-index: 20; background: transparent; border: 1.5px dashed var(--primary);
  outline: none; resize: none; overflow: hidden; padding: 2px 4px; margin: 0;
  color: inherit; font-family: inherit; line-height: 1.25; min-width: 20px;
}

.hint {
  position: absolute; left: 14px; bottom: 12px; z-index: 20;
  color: var(--muted); font-size: 12px; background: color-mix(in srgb, var(--surface) 88%, transparent);
  border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; pointer-events: none;
}
.zoomtag {
  position: absolute; right: 14px; bottom: 12px; z-index: 20;
  color: var(--muted); font-size: 12px; background: color-mix(in srgb, var(--surface) 88%, transparent);
  border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px;
}
.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
  background: #1e1e1e; color: #fff; padding: 8px 17px; border-radius: 999px;
  font-size: 13px; z-index: 90;
}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>

    <div class="toolbar">
      <button class="tool on" data-t="select" title="选择 (V)"></button>
      <button class="tool" data-t="hand" title="抓手 (H)，或按住空格"></button>
      <button class="tool" data-t="rect" title="矩形 (R)"></button>
      <button class="tool" data-t="ellipse" title="圆形 (O)"></button>
      <button class="tool" data-t="diamond" title="菱形 (D)"></button>
      <button class="tool" data-t="line" title="直线 (L)"></button>
      <button class="tool" data-t="arrow" title="箭头 (A)"></button>
      <button class="tool" data-t="pen" title="画笔 (P)"></button>
      <button class="tool" data-t="text" title="文字 (T)"></button>
      <button class="tool" data-t="eraser" title="橡皮 (E)"></button>
      <div class="sep"></div>
      <button class="mini" id="undo" title="撤销 (Ctrl+Z)">↶</button>
      <button class="mini" id="redo" title="重做 (Ctrl+Shift+Z)">↷</button>
      <div class="sep"></div>
      <button class="mini" id="zOut">−</button>
      <span id="zLabel" style="width:42px;text-align:center;color:var(--muted);font-size:12px">100%</span>
      <button class="mini" id="zIn">+</button>
      <button class="mini" id="fit" title="适应内容">⤢</button>
      <div class="sep"></div>
      <button class="mini" id="gridBtn" title="网格">#</button>
      <button class="mini" id="pngBtn">PNG</button>
      <button class="mini" id="svgBtn">SVG</button>
      <button class="mini" id="jsonBtn">JSON</button>
      <button class="mini" id="impBtn">导入</button>
      <button class="mini" id="clearBtn">清空</button>
    </div>

    <div class="props">
      <div class="grp">
        <div class="lbl">描边</div>
        <div class="sws" id="strokeSws"></div>
      </div>
      <div class="grp">
        <div class="lbl">填充</div>
        <div class="sws" id="fillSws"></div>
      </div>
      <div class="grp">
        <div class="lbl">填充样式</div>
        <select id="fillStyle">
          <option value="hachure">斜线排线</option>
          <option value="cross-hatch">交叉排线</option>
          <option value="solid">实心</option>
          <option value="zigzag">锯齿线</option>
          <option value="dots">圆点</option>
        </select>
      </div>
      <div class="grp">
        <div class="lbl">手绘粗糙度 <span class="val" id="roughVal">1</span></div>
        <input type="range" id="rough" min="0" max="2" step="1" value="1" />
      </div>
      <div class="grp">
        <div class="lbl">线宽</div>
        <select id="width">
          <option value="1">细</option>
          <option value="2" selected>中</option>
          <option value="4">粗</option>
        </select>
      </div>
      <div class="grp">
        <div class="lbl">字号 <span class="val" id="fontVal">20</span></div>
        <input type="range" id="fontSize" min="12" max="72" step="2" value="20" />
      </div>
    </div>

    <div class="hint" id="hint">选中：点选 / 框选 · 移动、拖角缩放 · 双击文字编辑</div>
    <div class="zoomtag" id="zoomtag">100%</div>
    <textarea class="editor" id="editor" hidden spellcheck="false"></textarea>
  </div>
</div>

<input type="file" id="fileJson" accept="application/json,.json" hidden />
<div class="toast" id="toast" hidden></div>

<script src="vendor/rough.js"></script>
<script type="module">
import { getStroke } from './vendor/freehand.mjs'

/* ================= 常量 ================= */
const STROKE_COLORS = ['#1e1e1e', '#e03131', '#2f9e44', '#1971c2', '#f08c00']
const FILL_COLORS = ['transparent', '#ffc9c9', '#b2f2bb', '#a5d8ff', '#ffec99', '#d0bfff']
const ROUGH_MAP = [0, 1, 2.2]
const GRID = 20
const FONT = 'system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'
const SAVE_KEY = 'whiteboard-standalone-v1'

const TOOL_ICONS = {
  select: '<path d="M5 3l14 8-6 1.5L16 19l-3 1.5L10 14l-5 4z"/>',
  hand: '<path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12m0-1V4.5a1.5 1.5 0 0 1 3 0V12m0-1.5a1.5 1.5 0 0 1 3 0V14c0 4-2.5 7-6.5 7S5 18 5 14v-3.5a1.5 1.5 0 0 1 3 0z"/>',
  rect: '<rect x="4" y="6" width="16" height="12" rx="1.5"/>',
  ellipse: '<ellipse cx="12" cy="12" rx="8" ry="6.5"/>',
  diamond: '<path d="M12 4l8 8-8 8-8-8z"/>',
  line: '<path d="M5 19L19 5"/>',
  arrow: '<path d="M5 19L19 5"/><path d="M13 5h6v6"/>',
  pen: '<path d="M4 17c3-8 6 3 9-4s4-2 7-7"/>',
  text: '<path d="M5 6V4h14v2M12 4v16M9 20h6"/>',
  eraser: '<path d="M4 16l7-7 7 7-4 4H8z"/><path d="M10 20h10"/>'
}

const $ = (id) => document.getElementById(id)
const cv = $('cv')
const stage = $('stage')
const editorEl = $('editor')

let ctx = cv.getContext('2d')
let rc = null
let dpr = window.devicePixelRatio || 1

/* ================= 状态 ================= */
let elements = []
let selection = new Set()
let tool = 'select'
let strokeColor = '#1e1e1e'
let fillColor = 'transparent'
let fillStyle = 'hachure'
let roughness = 1
let strokeWidth = 2
let fontSize = 20
let showGrid = false
let view = { zoom: 1, tx: 0, ty: 0 }
let uid = 1
let history = []
let histIdx = -1
let saveTimer = 0
let rafId = 0
let drag = null
let spaceDown = false
let editingId = null

/* ================= 工具条图标 ================= */
document.querySelectorAll('.tool').forEach((b) => {
  const k = b.dataset.t
  b.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
    stroke-linecap="round" stroke-linejoin="round">${TOOL_ICONS[k]}</svg>`
  b.addEventListener('click', () => setTool(k))
})

function setTool(k) {
  tool = k
  document.querySelectorAll('.tool').forEach((b) => b.classList.toggle('on', b.dataset.t === k))
  cv.style.cursor = k === 'hand' ? 'grab' : (k === 'text' ? 'text' : (k === 'select' ? 'default' : 'crosshair'))
  $('hint').textContent = {
    select: '点选 / 框选 · 拖动移动 · 拖角缩放 · 双击文字编辑',
    hand: '拖动平移画布',
    rect: '拖动绘制矩形（Shift 正方形）',
    ellipse: '拖动绘制圆形（Shift 正圆）',
    diamond: '拖动绘制菱形',
    line: '拖动绘制直线（Shift 锁 45°）',
    arrow: '拖动绘制箭头',
    pen: '按住自由绘制',
    text: '点击放置文字，输入后点击别处完成',
    eraser: '按住划过要删除的元素'
  }[k]
}

/* ================= 颜色按钮 ================= */
function buildSwatches(boxId, colors, isFill) {
  const box = $(boxId)
  colors.forEach((c) => {
    const d = document.createElement('div')
    d.className = 'sw' + (isFill && c === 'transparent' ? ' none' : '')
    d.style.background = isFill && c === 'transparent' ? '' : c
    d.dataset.c = c
    d.title = c
    d.addEventListener('click', () => {
      if (isFill) applyFill(c); else applyStroke(c)
    })
    box.appendChild(d)
  })
}
function syncSwatches() {
  document.querySelectorAll('#strokeSws .sw').forEach((d) => d.classList.toggle('on', d.dataset.c === strokeColor))
  document.querySelectorAll('#fillSws .sw').forEach((d) => {
    const same = d.dataset.c === fillColor
    d.classList.toggle('on', same)
  })
}
buildSwatches('strokeSws', STROKE_COLORS, false)
buildSwatches('fillSws', FILL_COLORS, true)

function applyStroke(c) {
  strokeColor = c
  selection.forEach((id) => { const e = byId(id); if (e) e.stroke = c })
  syncSwatches(); commit(); render()
}
function applyFill(c) {
  fillColor = c
  selection.forEach((id) => { const e = byId(id); if (e) e.fill = c })
  syncSwatches(); commit(); render()
}

$('fillStyle').addEventListener('change', (e) => {
  fillStyle = e.target.value
  selection.forEach((id) => { const el = byId(id); if (el) el.fillStyle = fillStyle })
  commit(); render()
})
$('rough').addEventListener('input', (e) => {
  roughness = Number(e.target.value)
  $('roughVal').textContent = roughness
  selection.forEach((id) => { const el = byId(id); if (el) el.roughness = roughness })
  commit(); render()
})
$('width').addEventListener('change', (e) => {
  strokeWidth = Number(e.target.value)
  selection.forEach((id) => { const el = byId(id); if (el) el.strokeWidth = strokeWidth })
  commit(); render()
})
$('fontSize').addEventListener('input', (e) => {
  fontSize = Number(e.target.value)
  $('fontVal').textContent = fontSize
  selection.forEach((id) => { const el = byId(id); if (el.type === 'text') { el.fontSize = fontSize; el.w = measureText(el); } })
  commit(); render()
})

/* ================= 元素模型 ================= */
function base(type, extra) {
  return Object.assign({
    id: uid++, type,
    x: 0, y: 0, w: 0, h: 0,
    stroke: strokeColor, fill: fillColor, fillStyle, roughness, strokeWidth,
    seed: Math.floor(Math.random() * 1e9)
  }, extra || {})
}
function byId(id) { return elements.find((e) => e.id === id) || null }

function measureText(el) {
  ctx.save()
  ctx.font = `500 ${el.fontSize}px ${FONT}`
  const lines = String(el.text || '').split('\n')
  const w = Math.max(20, Math.max(...lines.map((l) => ctx.measureText(l).width)) + 6)
  ctx.restore()
  return w
}

function bboxOf(el) {
  if (el.type === 'line' || el.type === 'arrow') {
    return {
      x: Math.min(el.x1, el.x2), y: Math.min(el.y1, el.y2),
      w: Math.abs(el.x2 - el.x1), h: Math.abs(el.y2 - el.y1)
    }
  }
  if (el.type === 'pen') {
    const xs = el.points.map((p) => p[0]), ys = el.points.map((p) => p[1])
    const x1 = Math.min(...xs), y1 = Math.min(...ys)
    return { x: x1, y: y1, w: Math.max(...xs) - x1, h: Math.max(...ys) - y1 }
  }
  if (el.type === 'text') {
    return { x: el.x, y: el.y, w: el.w || 20, h: el.fontSize * 1.35 * (String(el.text || '').split('\n').length) }
  }
  return { x: el.x, y: el.y, w: el.w, h: el.h }
}

function unionBox(list) {
  if (!list.length) return null
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity
  for (const e of list) {
    const b = bboxOf(e)
    x1 = Math.min(x1, b.x); y1 = Math.min(y1, b.y)
    x2 = Math.max(x2, b.x + b.w); y2 = Math.max(y2, b.y + b.h)
  }
  return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 }
}

/* ================= 视图变换 ================= */
function toScene(clientX, clientY) {
  const r = cv.getBoundingClientRect()
  return {
    x: (clientX - r.left - view.tx) / view.zoom,
    y: (clientY - r.top - view.ty) / view.zoom
  }
}
function applyTransform() {
  ctx.setTransform(dpr * view.zoom, 0, 0, dpr * view.zoom, dpr * view.tx, dpr * view.ty)
}

/* ================= 渲染 ================= */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight
  dpr = window.devicePixelRatio || 1
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr)
    cv.height = Math.round(h * dpr)
    rc = rough.canvas(cv)   // 画布尺寸变了必须重建 renderer
  }
  render()
}

function scheduleRender() {
  if (rafId) return
  rafId = requestAnimationFrame(() => { rafId = 0; render() })
}

function roughOpts(el) {
  return {
    stroke: el.stroke,
    strokeWidth: el.strokeWidth,
    fill: el.fill === 'transparent' ? undefined : el.fill,
    fillStyle: el.fillStyle,
    roughness: ROUGH_MAP[el.roughness] !== undefined ? ROUGH_MAP[el.roughness] : 1,
    seed: el.seed,
    bowing: 1
  }
}

function render() {
  if (!rc) rc = rough.canvas(cv)
  const w = stage.clientWidth, h = stage.clientHeight
  ctx.setTransform(1, 0, 0, 1, 0, 0)
  ctx.clearRect(0, 0, cv.width, cv.height)

  // 背景
  ctx.fillStyle = getComputedStyle(document.body).backgroundColor || '#f8f9fb'
  ctx.fillRect(0, 0, cv.width, cv.height)

  applyTransform()

  if (showGrid) drawGrid()

  for (const el of elements) drawElement(el)

  // 选中框
  const sel = [...selection].map(byId).filter(Boolean)
  if (sel.length) {
    const b = unionBox(sel)
    if (b) {
      ctx.save()
      ctx.strokeStyle = '#f08c00'
      ctx.lineWidth = 1 / view.zoom
      ctx.setLineDash([5 / view.zoom, 4 / view.zoom])
      ctx.strokeRect(b.x - 4, b.y - 4, b.w + 8, b.h + 8)
      ctx.setLineDash([])
      // 四角手柄
      const hs = handlePoints(b)
      ctx.fillStyle = '#fff'
      ctx.strokeStyle = '#f08c00'
      ctx.lineWidth = 1.5 / view.zoom
      const s = 8 / view.zoom
      hs.forEach((p) => {
        ctx.beginPath()
        ctx.rect(p.x - s / 2, p.y - s / 2, s, s)
        ctx.fill(); ctx.stroke()
      })
      ctx.restore()
    }
  }

  // 草稿线（框选）
  if (drag && drag.mode === 'marquee') {
    ctx.save()
    ctx.strokeStyle = 'rgba(240,140,0,.8)'
    ctx.fillStyle = 'rgba(240,140,0,.08)'
    ctx.lineWidth = 1 / view.zoom
    const b = normRect(drag.start, drag.cur)
    ctx.fillRect(b.x, b.y, b.w, b.h)
    ctx.strokeRect(b.x, b.y, b.w, b.h)
    ctx.restore()
  }

  $('zoomtag').textContent = Math.round(view.zoom * 100) + '%'
}

function drawGrid() {
  const step = GRID
  const tl = { x: (-view.tx) / view.zoom, y: (-view.ty) / view.zoom }
  const br = { x: (stage.clientWidth - view.tx) / view.zoom, y: (stage.clientHeight - view.ty) / view.zoom }
  ctx.save()
  ctx.strokeStyle = 'rgba(120,130,160,.18)'
  ctx.lineWidth = 1 / view.zoom
  ctx.beginPath()
  for (let x = Math.floor(tl.x / step) * step; x < br.x; x += step) {
    ctx.moveTo(x, tl.y); ctx.lineTo(x, br.y)
  }
  for (let y = Math.floor(tl.y / step) * step; y < br.y; y += step) {
    ctx.moveTo(tl.x, y); ctx.lineTo(br.x, y)
  }
  ctx.stroke()
  ctx.restore()
}

function drawElement(el) {
  const o = roughOpts(el)
  try {
    if (el.type === 'rect') rc.rectangle(el.x, el.y, el.w, el.h, o)
    else if (el.type === 'ellipse') rc.ellipse(el.x + el.w / 2, el.y + el.h / 2, Math.abs(el.w), Math.abs(el.h), o)
    else if (el.type === 'diamond') {
      rc.polygon([[el.x + el.w / 2, el.y], [el.x + el.w, el.y + el.h / 2], [el.x + el.w / 2, el.y + el.h], [el.x, el.y + el.h / 2]], o)
    } else if (el.type === 'line') {
      rc.line(el.x1, el.y1, el.x2, el.y2, { ...o, fill: undefined })
    } else if (el.type === 'arrow') {
      rc.line(el.x1, el.y1, el.x2, el.y2, { ...o, fill: undefined })
      const ang = Math.atan2(el.y2 - el.y1, el.x2 - el.x1)
      const len = Math.max(9, el.strokeWidth * 4)
      const a1 = ang + Math.PI - 0.42
      const a2 = ang + Math.PI + 0.42
      rc.line(el.x2, el.y2, el.x2 + Math.cos(a1) * len, el.y2 + Math.sin(a1) * len, { ...o, fill: undefined })
      rc.line(el.x2, el.y2, el.x2 + Math.cos(a2) * len, el.y2 + Math.sin(a2) * len, { ...o, fill: undefined })
    } else if (el.type === 'pen') {
      drawPen(el)
    } else if (el.type === 'text') {
      ctx.save()
      ctx.fillStyle = el.stroke
      ctx.font = `500 ${el.fontSize}px ${FONT}`
      ctx.textBaseline = 'top'
      String(el.text || '').split('\n').forEach((line, i) => {
        ctx.fillText(line, el.x + 2, el.y + i * el.fontSize * 1.35 + 2)
      })
      ctx.restore()
    }
  } catch (e) { /* 单个元素画失败不影响其它 */ }
}

function drawPen(el) {
  if (el.points.length < 2) return
  const outline = getStroke(el.points, {
    size: el.strokeWidth * 2.2,
    thinning: 0.55,
    smoothing: 0.5,
    streamline: 0.5,
    simulatePressure: true,
    last: true
  })
  if (!outline.length) return
  ctx.save()
  ctx.beginPath()
  outline.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])))
  ctx.closePath()
  ctx.fillStyle = el.stroke
  ctx.fill()
  ctx.restore()
}

/* ================= 命中和几何 ================= */
function normRect(a, b) {
  return {
    x: Math.min(a.x, b.x), y: Math.min(a.y, b.y),
    w: Math.abs(b.x - a.x), h: Math.abs(b.y - a.y)
  }
}

function distToSeg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1
  const len2 = dx * dx + dy * dy
  let t = len2 ? ((px - x1) * dx + (py - y1) * dy) / len2 : 0
  t = Math.max(0, Math.min(1, t))
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy))
}

function hitTest(el, p, pad) {
  const b = bboxOf(el)
  pad = pad == null ? 6 / view.zoom : pad
  if (el.type === 'line' || el.type === 'arrow') {
    return distToSeg(p.x, p.y, el.x1, el.y1, el.x2, el.y2) <= Math.max(pad, el.strokeWidth + 3)
  }
  if (el.type === 'pen') {
    for (let i = 1; i < el.points.length; i++) {
      if (distToSeg(p.x, p.y, el.points[i - 1][0], el.points[i - 1][1], el.points[i][0], el.points[i][1]) <= Math.max(pad, el.strokeWidth + 3)) return true
    }
    return false
  }
  if (el.type === 'ellipse') {
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2
    if (!b.w || !b.h) return false
    const nx = (p.x - cx) / (b.w / 2 + pad)
    const ny = (p.y - cy) / (b.h / 2 + pad)
    return nx * nx + ny * ny <= 1
  }
  return p.x >= b.x - pad && p.x <= b.x + b.w + pad && p.y >= b.y - pad && p.y <= b.y + b.h + pad
}

function topmostAt(p) {
  for (let i = elements.length - 1; i >= 0; i--) {
    if (hitTest(elements[i], p)) return elements[i]
  }
  return null
}

function handlePoints(b) {
  return [
    { x: b.x, y: b.y, k: 'nw' },
    { x: b.x + b.w, y: b.y, k: 'ne' },
    { x: b.x + b.w, y: b.y + b.h, k: 'se' },
    { x: b.x, y: b.y + b.h, k: 'sw' }
  ]
}
function handleAt(p) {
  const sel = [...selection].map(byId).filter(Boolean)
  if (!sel.length) return null
  const b = unionBox(sel)
  if (!b) return null
  const tol = 9 / view.zoom
  for (const h of handlePoints(b)) {
    if (Math.abs(p.x - h.x) <= tol && Math.abs(p.y - h.y) <= tol) return { k: h.k, box: b }
  }
  return null
}

/* ================= 指针交互 ================= */
cv.addEventListener('pointerdown', (e) => {
  // 正在编辑文字时，画布上的任何按下都先当成「结束编辑」，不要顺手再画一个新元素
  if (!editorEl.hidden) { closeEditor(); return }

  if (e.button === 1 || spaceDown || tool === 'hand') {
    drag = { mode: 'pan', sx: e.clientX, sy: e.clientY, tx: view.tx, ty: view.ty }
    cv.style.cursor = 'grabbing'
    return
  }
  const p = toScene(e.clientX, e.clientY)

  if (tool === 'eraser') {
    drag = { mode: 'erase' }
    eraseAt(p)
    return
  }

  if (tool === 'select') {
    const h = handleAt(p)
    if (h) {
      drag = { mode: 'resize', k: h.k, box0: h.box, start: p, orig: JSON.parse(JSON.stringify(elements)) }
      return
    }
    const el = topmostAt(p)
    if (el) {
      if (e.shiftKey) {
        selection.has(el.id) ? selection.delete(el.id) : selection.add(el.id)
      } else if (!selection.has(el.id)) {
        selection = new Set([el.id])
      }
      drag = { mode: 'move', start: p, orig: JSON.parse(JSON.stringify(elements)) }
      render()
      return
    }
    if (!e.shiftKey) selection = new Set()
    drag = { mode: 'marquee', start: p, cur: p, add: e.shiftKey, base: new Set(selection) }
    render()
    return
  }

  if (tool === 'text') {
    const el = base('text', { x: p.x, y: p.y, text: '', fontSize, stroke: strokeColor, w: 24 })
    elements.push(el)
    selection = new Set([el.id])
    commit(); render()
    // 必须延后一帧再聚焦：浏览器在这次 mousedown 的默认行为里会把焦点交回画布/body，
    // 同步调用 focus() 会被随后的默认聚焦抢走，进而触发 blur → closeEditor 把空文字删掉。
    requestAnimationFrame(() => openEditor(el))
    return
  }

  if (tool === 'pen') {
    const el = base('pen', { points: [[p.x, p.y]], stroke: strokeColor })
    elements.push(el)
    selection = new Set([el.id])
    drag = { mode: 'draw', el }
    render()
    return
  }

  if (tool === 'line' || tool === 'arrow') {
    const el = base(tool, { x1: p.x, y1: p.y, x2: p.x, y2: p.y })
    elements.push(el)
    selection = new Set([el.id])
    drag = { mode: 'draw', el, start: p }
    render()
    return
  }

  // 矩形 / 圆 / 菱形
  const el = base(tool, { x: p.x, y: p.y, w: 0, h: 0 })
  elements.push(el)
  selection = new Set([el.id])
  drag = { mode: 'draw', el, start: p }
  render()
})

cv.addEventListener('pointermove', (e) => {
  if (!drag) {
    const p = toScene(e.clientX, e.clientY)
    if (tool === 'select') {
      cv.style.cursor = handleAt(p) ? 'nwse-resize' : (topmostAt(p) ? 'move' : 'default')
    }
    return
  }
  const p = toScene(e.clientX, e.clientY)

  if (drag.mode === 'pan') {
    view.tx = drag.tx + (e.clientX - drag.sx)
    view.ty = drag.ty + (e.clientY - drag.sy)
    render(); return
  }

  if (drag.mode === 'erase') { eraseAt(p); return }

  if (drag.mode === 'draw') {
    const el = drag.el
    if (el.type === 'pen') {
      el.points.push([p.x, p.y])
    } else if (el.type === 'line' || el.type === 'arrow') {
      let x2 = p.x, y2 = p.y
      if (e.shiftKey) {
        const ang = Math.round(Math.atan2(y2 - drag.start.y, x2 - drag.start.x) / (Math.PI / 4)) * (Math.PI / 4)
        const len = Math.hypot(x2 - drag.start.x, y2 - drag.start.y)
        x2 = drag.start.x + Math.cos(ang) * len
        y2 = drag.start.y + Math.sin(ang) * len
      }
      el.x2 = x2; el.y2 = y2
    } else {
      let w = p.x - drag.start.x, h = p.y - drag.start.y
      if (e.shiftKey) {
        const m = Math.max(Math.abs(w), Math.abs(h))
        w = Math.sign(w || 1) * m; h = Math.sign(h || 1) * m
      }
      el.x = Math.min(drag.start.x, drag.start.x + w)
      el.y = Math.min(drag.start.y, drag.start.y + h)
      el.w = Math.abs(w); el.h = Math.abs(h)
    }
    scheduleRender(); return
  }

  if (drag.mode === 'move') {
    const dx = p.x - drag.start.x
    const dy = p.y - drag.start.y
    const ids = new Set(selection)
    for (const el of elements) {
      if (!ids.has(el.id)) continue
      const o = drag.orig.find((x) => x.id === el.id)
      if (!o) continue
      moveTo(el, o, dx, dy)
    }
    scheduleRender(); return
  }

  if (drag.mode === 'resize') {
    applyResize(drag, p)
    scheduleRender(); return
  }

  if (drag.mode === 'marquee') {
    drag.cur = p
    const b = normRect(drag.start, p)
    const inside = elements.filter((el) => {
      const eb = bboxOf(el)
      return eb.x >= b.x && eb.y >= b.y && eb.x + eb.w <= b.x + b.w && eb.y + eb.h <= b.y + b.h
    }).map((el) => el.id)
    selection = new Set([...(drag.add ? drag.base : []), ...inside])
    scheduleRender()
  }
})

window.addEventListener('pointerup', () => {
  if (!drag) return
  const mode = drag.mode
  // 丢掉误触产生的零尺寸图形 —— 必须按类型分别判断：
  // 画笔的类型是 pen，它没有 w/h（恒为 0），用统一的「尺寸过小」判定会把它误删。
  if (mode === 'draw') {
    const el = drag.el
    const drop = () => { elements = elements.filter((x) => x !== el) }
    if (el.type === 'pen') {
      if (el.points.length < 2) drop()
    } else if (el.type === 'line' || el.type === 'arrow') {
      if (Math.hypot(el.x2 - el.x1, el.y2 - el.y1) < 3) drop()
    } else if (el.type === 'rect' || el.type === 'ellipse' || el.type === 'diamond') {
      if (el.w < 3 || el.h < 3) drop()
    }
  }
  if (mode === 'draw' || mode === 'move' || mode === 'resize' || mode === 'erase') commit()
  drag = null
  cv.style.cursor = tool === 'hand' ? 'grab' : 'default'
  render()
})

function moveTo(el, o, dx, dy) {
  if (el.type === 'line' || el.type === 'arrow') {
    el.x1 = o.x1 + dx; el.y1 = o.y1 + dy; el.x2 = o.x2 + dx; el.y2 = o.y2 + dy
  } else if (el.type === 'pen') {
    el.points = o.points.map((q) => [q[0] + dx, q[1] + dy])
  } else {
    el.x = o.x + dx; el.y = o.y + dy
  }
}

function applyResize(d, p) {
  const b0 = d.box0
  let x1 = b0.x, y1 = b0.y, x2 = b0.x + b0.w, y2 = b0.y + b0.h
  const MIN = 6
  if (d.k === 'nw') { x1 = Math.min(p.x, x2 - MIN); y1 = Math.min(p.y, y2 - MIN) }
  if (d.k === 'ne') { x2 = Math.max(p.x, x1 + MIN); y1 = Math.min(p.y, y2 - MIN) }
  if (d.k === 'se') { x2 = Math.max(p.x, x1 + MIN); y2 = Math.max(p.y, y1 + MIN) }
  if (d.k === 'sw') { x1 = Math.min(p.x, x2 - MIN); y2 = Math.max(p.y, y1 + MIN) }
  const nw = x2 - x1, nh = y2 - y1
  const sx = b0.w ? nw / b0.w : 1
  const sy = b0.h ? nh / b0.h : 1

  for (const el of elements) {
    if (!selection.has(el.id)) continue
    const o = d.orig.find((x) => x.id === el.id)
    if (!o) continue
    const ob = bboxOf(o)
    if (el.type === 'line' || el.type === 'arrow') {
      el.x1 = x1 + (o.x1 - b0.x) * sx; el.y1 = y1 + (o.y1 - b0.y) * sy
      el.x2 = x1 + (o.x2 - b0.x) * sx; el.y2 = y1 + (o.y2 - b0.y) * sy
    } else if (el.type === 'pen') {
      el.points = o.points.map((q) => [x1 + (q[0] - b0.x) * sx, y1 + (q[1] - b0.y) * sy])
    } else if (el.type === 'text') {
      el.x = x1 + (o.x - b0.x) * sx
      el.y = y1 + (o.y - b0.y) * sy
      el.fontSize = Math.max(8, Math.round(o.fontSize * sy))
      el.w = measureText(el)
    } else {
      el.x = x1 + (o.x - b0.x) * sx
      el.y = y1 + (o.y - b0.y) * sy
      el.w = Math.max(MIN, ob.w * sx)
      el.h = Math.max(MIN, ob.h * sy)
    }
  }
}

function eraseAt(p) {
  const hit = topmostAt(p)
  if (!hit) return
  elements = elements.filter((x) => x !== hit)
  selection.delete(hit.id)
  commitThrottled()
  scheduleRender()
}

let eraseTimer = 0
function commitThrottled() {
  clearTimeout(eraseTimer)
  eraseTimer = setTimeout(() => commit(), 350)
}

/* ================= 文字编辑 ================= */
function openEditor(el) {
  editingId = el.id
  editorEl.hidden = false
  editorEl.value = el.text || ''
  editorEl.style.fontSize = (el.fontSize * view.zoom) + 'px'
  editorEl.style.color = el.stroke
  positionEditor(el)
  editorEl.focus()
  editorEl.select()
}
function positionEditor(el) {
  if (!editingId) return
  const b = bboxOf(el)
  editorEl.style.left = (b.x * view.zoom + view.tx) + 'px'
  editorEl.style.top = (b.y * view.zoom + view.ty) + 'px'
  editorEl.style.width = Math.max(40, (b.w || 40) * view.zoom + 20) + 'px'
  editorEl.style.height = Math.max(24, b.h * view.zoom + 6) + 'px'
}
editorEl.addEventListener('input', () => {
  const el = byId(editingId)
  if (!el) return
  el.text = editorEl.value
  el.w = measureText(el)
  positionEditor(el)
  scheduleRender()
})
editorEl.addEventListener('blur', () => closeEditor())
editorEl.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { e.preventDefault(); closeEditor() }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); closeEditor() }
  e.stopPropagation()
})

function closeEditor() {
  const el = byId(editingId)
  if (el && !String(el.text || '').trim()) elements = elements.filter((x) => x !== el)
  editorEl.hidden = true
  editingId = null
  commit(); render()
}

cv.addEventListener('dblclick', (e) => {
  const p = toScene(e.clientX, e.clientY)
  const el = topmostAt(p)
  if (el && el.type === 'text') { selection = new Set([el.id]); openEditor(el) }
})

/* ================= 缩放 / 平移 ================= */
cv.addEventListener('wheel', (e) => {
  e.preventDefault()
  const r = cv.getBoundingClientRect()
  const cx = e.clientX - r.left
  const cy = e.clientY - r.top
  const k = e.deltaY < 0 ? 1.1 : 1 / 1.1
  setZoom(view.zoom * k, cx, cy)
}, { passive: false })

function setZoom(nz, cx, cy) {
  nz = Math.min(4, Math.max(0.2, nz))
  cx = cx == null ? stage.clientWidth / 2 : cx
  cy = cy == null ? stage.clientHeight / 2 : cy
  const k = nz / view.zoom
  view.tx = cx - (cx - view.tx) * k
  view.ty = cy - (cy - view.ty) * k
  view.zoom = nz
  render()
}
$('zIn').addEventListener('click', () => setZoom(view.zoom * 1.2))
$('zOut').addEventListener('click', () => setZoom(view.zoom / 1.2))
$('fit').addEventListener('click', fitView)
$('gridBtn').addEventListener('click', () => {
  showGrid = !showGrid
  $('gridBtn').style.color = showGrid ? 'var(--primary)' : ''
  render()
})

function fitView() {
  const b = unionBox(elements)
  if (!b) { setZoom(1); view.tx = 0; view.ty = 0; render(); return }
  const padX = 80, padY = 120
  const z = Math.min(2, Math.max(0.2, Math.min(
    (stage.clientWidth - padX) / Math.max(1, b.w),
    (stage.clientHeight - padY) / Math.max(1, b.h)
  )))
  view.zoom = z
  view.tx = (stage.clientWidth - b.w * z) / 2 - b.x * z
  view.ty = (stage.clientHeight - b.h * z) / 2 - b.y * z
  render()
}

/* ================= 历史 / 存储 ================= */
function snap() { return JSON.stringify(elements) }
function commit() {
  const s = snap()
  if (history[histIdx] === s) return
  history = history.slice(0, histIdx + 1)
  history.push(s)
  if (history.length > 60) history.shift()
  histIdx = history.length - 1
  syncUndo()
  scheduleSave()
}
function restore(s) {
  elements = JSON.parse(s)
  const ids = new Set(elements.map((e) => e.id))
  for (const id of [...selection]) if (!ids.has(id)) selection.delete(id)
  render()
}
function undo() {
  if (histIdx <= 0) return
  histIdx--
  restore(history[histIdx]); syncUndo(); scheduleSave()
}
function redo() {
  if (histIdx >= history.length - 1) return
  histIdx++
  restore(history[histIdx]); syncUndo(); scheduleSave()
}
function syncUndo() {
  $('undo').disabled = histIdx <= 0
  $('redo').disabled = histIdx >= history.length - 1
}

function scheduleSave() {
  clearTimeout(saveTimer)
  saveTimer = setTimeout(saveNow, 500)
}
function saveNow() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ elements, view })) } catch (e) {}
}
function loadSaved() {
  try {
    const raw = localStorage.getItem(SAVE_KEY)
    if (!raw) return false
    const d = JSON.parse(raw)
    if (!Array.isArray(d.elements)) return false
    elements = d.elements
    if (d.view) view = d.view
    uid = elements.reduce((m, e) => Math.max(m, e.id || 0), 0) + 1
    return elements.length > 0
  } catch (e) { return false }
}

$('undo').addEventListener('click', undo)
$('redo').addEventListener('click', redo)

/* ================= 键盘 ================= */
window.addEventListener('keydown', (e) => {
  const editing = !editorEl.hidden || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)
  const mod = e.ctrlKey || e.metaKey

  if (e.code === 'Space' && !editing) { spaceDown = true; e.preventDefault() }
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return }
  if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return }
  if (mod && e.key.toLowerCase() === 'a') {
    if (editing) return
    e.preventDefault()
    selection = new Set(elements.map((x) => x.id)); render(); return
  }
  if (mod && e.key.toLowerCase() === 'd') {
    if (editing || !selection.size) return
    e.preventDefault()
    duplicateSelection(); return
  }
  if (editing) return

  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (!selection.size) return
    e.preventDefault()
    elements = elements.filter((x) => !selection.has(x.id))
    selection.clear(); commit(); render(); return
  }
  if (e.key.startsWith('Arrow') && selection.size) {
    e.preventDefault()
    const d = e.shiftKey ? 10 : 1
    const dx = e.key === 'ArrowLeft' ? -d : e.key === 'ArrowRight' ? d : 0
    const dy = e.key === 'ArrowUp' ? -d : e.key === 'ArrowDown' ? d : 0
    for (const el of elements) {
      if (!selection.has(el.id)) continue
      moveTo(el, el, dx, dy)
    }
    render()
    return
  }
  const map = { v: 'select', h: 'hand', r: 'rect', o: 'ellipse', d: 'diamond', l: 'line', a: 'arrow', p: 'pen', t: 'text', e: 'eraser' }
  const k = map[e.key.toLowerCase()]
  if (k && !mod) setTool(k)
})
window.addEventListener('keyup', (e) => {
  if (e.code === 'Space') spaceDown = false
  if (e.key.startsWith('Arrow') && selection.size) commit()
})

function duplicateSelection() {
  const copies = elements.filter((x) => selection.has(x.id)).map((el) => {
    const c = JSON.parse(JSON.stringify(el))
    c.id = uid++
    c.seed = Math.floor(Math.random() * 1e9)
    if (c.type === 'line' || c.type === 'arrow') { c.x1 += 20; c.y1 += 20; c.x2 += 20; c.y2 += 20 }
    else if (c.type === 'pen') c.points = c.points.map((q) => [q[0] + 20, q[1] + 20])
    else { c.x += 20; c.y += 20 }
    return c
  })
  elements.push(...copies)
  selection = new Set(copies.map((c) => c.id))
  commit(); render()
}

/* ================= 导出 / 导入 ================= */
function toast(msg) {
  const t = $('toast')
  t.textContent = msg
  t.hidden = false
  clearTimeout(t._t)
  t._t = setTimeout(() => { t.hidden = true }, 1800)
}
function download(href, name) {
  const a = document.createElement('a')
  a.href = href
  a.download = name
  a.click()
}

$('pngBtn').addEventListener('click', () => {
  const b = unionBox(elements)
  if (!b) { toast('画布是空的'); return }
  const pad = 40
  const scale = 2
  const w = Math.ceil(b.w + pad * 2)
  const h = Math.ceil(b.h + pad * 2)
  const off = document.createElement('canvas')
  off.width = w * scale
  off.height = h * scale
  const g = off.getContext('2d')
  g.fillStyle = '#ffffff'
  g.fillRect(0, 0, off.width, off.height)

  // 借主画布绘制：临时切换 ctx 与视图
  const mainCtx = ctx
  const mainView = { ...view }
  const mainRc = rc
  ctx = g
  rc = rough.canvas(off)
  view = { zoom: 1, tx: 0, ty: 0 }
  g.setTransform(scale, 0, 0, scale, (pad - b.x) * scale, (pad - b.y) * scale)
  for (const el of elements) drawElement(el)

  ctx = mainCtx; rc = mainRc; view = mainView

  off.toBlob((blob) => {
    if (!blob) return
    const url = URL.createObjectURL(blob)
    download(url, 'whiteboard.png')
    setTimeout(() => URL.revokeObjectURL(url), 5000)
    toast('已导出 PNG（' + off.width + '×' + off.height + '）')
  }, 'image/png')
})

$('svgBtn').addEventListener('click', () => {
  const b = unionBox(elements)
  if (!b) { toast('画布是空的'); return }
  const pad = 20
  const NS = 'http://www.w3.org/2000/svg'
  const svg = document.createElementNS(NS, 'svg')
  svg.setAttribute('xmlns', NS)
  svg.setAttribute('width', Math.ceil(b.w + pad * 2))
  svg.setAttribute('height', Math.ceil(b.h + pad * 2))
  svg.setAttribute('viewBox', `${b.x - pad} ${b.y - pad} ${Math.ceil(b.w + pad * 2)} ${Math.ceil(b.h + pad * 2)}`)

  const bg = document.createElementNS(NS, 'rect')
  bg.setAttribute('x', b.x - pad); bg.setAttribute('y', b.y - pad)
  bg.setAttribute('width', Math.ceil(b.w + pad * 2)); bg.setAttribute('height', Math.ceil(b.h + pad * 2))
  bg.setAttribute('fill', '#ffffff')
  svg.appendChild(bg)

  const gen = rough.svg(svg)
  for (const el of elements) {
    const o = roughOpts(el)
    let node = null
    if (el.type === 'rect') node = gen.rectangle(el.x, el.y, el.w, el.h, o)
    else if (el.type === 'ellipse') node = gen.ellipse(el.x + el.w / 2, el.y + el.h / 2, Math.abs(el.w), Math.abs(el.h), o)
    else if (el.type === 'diamond') node = gen.polygon([[el.x + el.w / 2, el.y], [el.x + el.w, el.y + el.h / 2], [el.x + el.w / 2, el.y + el.h], [el.x, el.y + el.h / 2]], o)
    else if (el.type === 'line' || el.type === 'arrow') {
      node = gen.line(el.x1, el.y1, el.x2, el.y2, { ...o, fill: undefined })
      if (el.type === 'arrow') {
        const ang = Math.atan2(el.y2 - el.y1, el.x2 - el.x1)
        const len = Math.max(9, el.strokeWidth * 4)
        const a1 = ang + Math.PI - 0.42, a2 = ang + Math.PI + 0.42
        svg.appendChild(gen.line(el.x2, el.y2, el.x2 + Math.cos(a1) * len, el.y2 + Math.sin(a1) * len, { ...o, fill: undefined }))
        svg.appendChild(gen.line(el.x2, el.y2, el.x2 + Math.cos(a2) * len, el.y2 + Math.sin(a2) * len, { ...o, fill: undefined }))
      }
    } else if (el.type === 'text') {
      const t = document.createElementNS(NS, 'text')
      t.setAttribute('x', el.x + 2)
      t.setAttribute('y', el.y + el.fontSize)
      t.setAttribute('fill', el.stroke)
      t.setAttribute('font-size', el.fontSize)
      t.setAttribute('font-family', FONT)
      String(el.text || '').split('\n').forEach((line, i) => {
        const ts = document.createElementNS(NS, 'tspan')
        ts.setAttribute('x', el.x + 2)
        ts.setAttribute('dy', i === 0 ? 0 : el.fontSize * 1.35)
        ts.textContent = line
        t.appendChild(ts)
      })
      svg.appendChild(t)
    } else if (el.type === 'pen') {
      const outline = getStroke(el.points, {
        size: el.strokeWidth * 2.2, thinning: 0.55, smoothing: 0.5,
        streamline: 0.5, simulatePressure: true, last: true
      })
      if (outline.length) {
        const p = document.createElementNS(NS, 'path')
        p.setAttribute('d', outline.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ') + ' Z')
        p.setAttribute('fill', el.stroke)
        svg.appendChild(p)
      }
    }
    if (node) svg.appendChild(node)
  }

  const code = new XMLSerializer().serializeToString(svg)
  const blob = new Blob([code], { type: 'image/svg+xml' })
  const url = URL.createObjectURL(blob)
  download(url, 'whiteboard.svg')
  setTimeout(() => URL.revokeObjectURL(url), 5000)
  toast('已导出 SVG')
})

$('jsonBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({ version: 1, elements }, null, 2)], { type: 'application/json' })
  const url = URL.createObjectURL(blob)
  download(url, 'whiteboard.json')
  setTimeout(() => URL.revokeObjectURL(url), 5000)
  toast('已导出 JSON')
})

$('impBtn').addEventListener('click', () => $('fileJson').click())
$('fileJson').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0]
  e.target.value = ''
  if (!f) return
  const fr = new FileReader()
  fr.onload = () => {
    try {
      const d = JSON.parse(fr.result)
      if (!Array.isArray(d.elements)) throw new Error('JSON 里没有 elements 数组')
      elements = d.elements
      uid = elements.reduce((m, x) => Math.max(m, x.id || 0), 0) + 1
      selection.clear()
      commit(); render(); fitView()
      toast('已导入 ' + elements.length + ' 个元素')
    } catch (err) { alert('导入失败：' + err.message) }
  }
  fr.readAsText(f)
})

let clearArmed = false
$('clearBtn').addEventListener('click', () => {
  if (!clearArmed) {
    clearArmed = true
    $('clearBtn').textContent = '再点一次'
    setTimeout(() => { clearArmed = false; $('clearBtn').textContent = '清空' }, 3000)
    return
  }
  clearArmed = false
  $('clearBtn').textContent = '清空'
  elements = []
  selection.clear()
  commit(); render()
  toast('已清空')
})

/* ================= 启动 ================= */
/* 调试 / 自动化钩子：必须用 getter——elements、selection 是会被整体重新赋值的 let 变量，
   直接存引用会读到旧数组。 */
window.__wb = {
  get elements() { return elements },
  get selection() { return selection },
  get histIdx() { return histIdx },
  get view() { return view },
  get tool() { return tool },
  get editingId() { return editingId },
  getStroke,
  commit,
  setTool
}

new ResizeObserver(resize).observe(stage)
window.addEventListener('resize', resize)

const had = loadSaved()
syncSwatches()
setTool('select')
resize()
if (had) { commit(); fitView() } else commit()
syncUndo()
</script>
</body>
</html>
